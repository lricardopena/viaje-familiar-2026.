ites · Plattsburgh · 3 noches", "ev": "<div class=\"evnote\"><b>Ruta recomendada:</b> Branford → Albany → Plattsburgh. La carga principal está pensada para coincidir con la parada en Albany; Enfield y Clifton Park quedan como respaldos reales compatibles con tu EV6.</div><div class=\"evlist\"><div class=\"evopt good\"><b>✅ Principal: Albany, NY – Northern Boulevard · NACS DC</b><small>Loudon Plaza · 350 Northern Blvd, Albany, NY 12204 · 8 Superchargers · hasta 325 kW · abierto a otros EV. Excelente para cargar antes/después del museo y continuar hacia Plattsburgh.</small><a href=\"https://www.google.com/maps/dir/?api=1&destination=350+Northern+Blvd,+Albany,+NY+12204\" target=\"_blank\">🚗 Ir ahora</a></div><div class=\"evopt good\"><b>✅ Respaldo temprano: Enfield, CT · NACS DC</b><small>65 Palomba Dr, Enfield, CT 06082 · 12 Superchargers · hasta 250 kW · abierto a otros EV. Úsalo solo si sales de Branford con menos batería de la prevista o necesitan una pausa.</small><a href=\"https://www.google.com/maps/dir/?api=1&destination=65+Palomba+Dr,+Enfield,+CT+06082\" target=\"_blank\">🚗 Ir ahora</a></div><div class=\"evopt good\"><b>✅ Respaldo al norte de Albany: Clifton Park, NY · NACS DC</b><small>22 Clifton Country Rd, Clifton Park, NY 12065 · 24 Superchargers · hasta 325 kW · abierto a otros EV. Está sobre el corredor hacia Plattsburgh y sirve si Albany está lleno o quieren cargar después de la actividad.</small><a href=\"https://www.google.com/maps/dir/?api=1&destination=22+Clifton+Country+Rd,+Clifton+Park,+NY+12065\" target=\"_blank\">🚗 Ir ahora</a></div><div class=\"evopt backup\"><b>🔌 Noche: La Quinta Inn Plattsburgh · J1772 Level 2</b><small>16 Plaza Blvd · si está disponible, déjalo conectado durante la noche con tu adaptador J1772→NACS.</small><a href=\"https://www.google.com/maps/dir/?api=1&destination=16+Plaza+Blvd,+Plattsburgh,+NY+12901\" target=\"_blank\">🚗 Ir al hotel</a></div></div>", "maps": ["New York State Museum, 222 Madison Ave, Albany, NY 12230", "Empire State Plaza, Albany, NY 12242", "Shepard Park, Canada St, Lake George, NY 12845", "Canada Street, Lake George, NY 12845", "La Quinta Inn & Suites by Wyndham Plattsburgh, 16 Plaza Blvd, Plattsburgh, NY 12901"]}, {"d": "15", "dow": "Sábado", "place": "Lake Placid + Tupper Lake, NY", "emoji": "🎢", "tag": "Montaña rusa alpina + naturaleza vista desde arriba", "img": "Lake Placid, New York.jpg", "credit": "Lake Placid · foto de referencia", "wx": "☀️ 21°C / 10–11°C · mañana fresca", "acts": [["09:00–10:00", "Cliffside Coaster", "Una montaña rusa alpina en Lake Placid: velocidad, curvas y montaña.", "🎢 Gran emoción"], ["13:00–14:00", "The Wild Center + Wild Walk", "Museo de naturaleza y una caminata elevada para ver el bosque desde otra perspectiva.", "🌲 Explorar y descubrir"]], "pack": "Pants 3/4 o mezclilla + playera. Sudadera para la mañana fría.", "hotel": "Regreso a La Quinta Inn & Suites · Plattsburgh", "ev": "<div class=\"evlist\"><div class=\"evopt good\"><b>✅ Principal: Lake Placid Supercharger<\/b><small>1930 Saranac Ave · NACS directo · hasta 250 kW · abierto a no-Tesla. Sal a Tupper Lake con 80%+.<\/small><a href=\"https://www.google.com/maps/search/?api=1&query=Lake+Placid+Supercharger+1930+Saranac+Ave\" target=\"_blank\">Mapa<\/a><\/div><div class=\"evopt good\"><b>✅ Alternativa: Williston VT<\/b><small>31 Market St · NACS directo · hasta 250 kW.<\/small><a href=\"https://www.google.com/maps/search/?api=1&query=Williston+VT+Supercharger+31+Market+St\" target=\"_blank\">Mapa<\/a><\/div><div class=\"evopt backup\"><b>🔌 Olympic Sports Complex · J1772 Level 2<\/b><small>Bob Run Rd, Lake Placid · cargadores J1772 reportados hasta ~7 kW. Útil mientras están en la zona del Cliffside Coaster.<\/small><a href=\"https://www.google.com/maps/search/?api=1&query=Olympic+Sports+Complex+EV+charging+Bob+Run+Rd+Lake+Placid\" target=\"_blank\">Mapa<\/a><\/div><div class=\"evopt backup\"><b>🔌 La Quinta Inn Plattsburgh · J1772 Level 2<\/b><small>De regreso al hotel, puedes
