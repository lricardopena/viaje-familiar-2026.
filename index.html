const days=[{"d": "14", "dow": "Viernes", "place": "Home → Albany, NY → Plattsburgh, NY", "emoji": "🏛️", "tag": "Primer día de carretera: Albany + parada frente al lago en Lake George antes del hotel", "img": "Empire State Plaza Albany NY.jpg", "credit": "Albany / Empire State Plaza · foto de referencia", "wx": "☀️ Día de carretera · revisa el clima en Albany y Plattsburgh antes de salir", "acts": [["Mañana", "Salida de Home", "Empezamos el viaje hacia el norte. La idea es avanzar tranquilos y usar la parada en Albany para estirar las piernas, comer y hacer algo divertido.", "🚗 Comienza la aventura"], ["13:00–15:30 aprox.", "New York State Museum + Empire State Plaza", "Mi recomendación con niños: entrar al museo gratuito, ver naturaleza/historia y el carrusel, y después caminar unos minutos por Empire State Plaza. Si llegan a la 1:00 pm pueden intentar el tour gratuito de la Plaza; si llegan antes de las 4:00 pm también pueden subir al Corning Tower Observation Deck.", "🏛️ Parada familiar"], ["19:10–19:35 aprox.", "Shepard Park · Lake George", "Primera parada frente al lago: caminata corta por Shepard Park para ver Lake George, tomar fotos y dejar que el niño corra un poco. Para estacionar, busca Beach Road Parking / espacios públicos cerca de Shepard Park y Canada Street. Es muy fácil de recortar si llegan más tarde.", "🌊 Vista al lago"], ["19:35–20:10 aprox.", "Canada Street + Lakefront Walk", "Después recorremos un tramo de Canada Street y el paseo junto al lago para ver el ambiente del Village, buscar helado, cena rápida o alguna tienda divertida.", "🍦 Paseo + algo rico"], ["20:10 aprox.", "Lake George → Plattsburgh", "Salimos por I-87 North hacia La Quinta en Plattsburgh. Si están cansados, pueden hacer solo Shepard Park y seguir directamente al hotel.", "🚗 Último tramo"]], "pack": "Ropa cómoda de carretera: playera + bermudas/pants ligeros + tenis. Llevar sudadera ligera para la tarde/noche y una botella de agua.", "hotel": "La Quinta Inn & Suites · Plattsburgh · 3 noches", "ev": "<div class=\"evnote\"><b>Ruta recomendada:</b> casa → Albany → Plattsburgh. La carga principal está pensada para coincidir con la parada en Albany; Enfield y Clifton Park quedan como respaldos reales compatibles con tu EV6.</div><div class=\"evlist\"><div class=\"evopt good\"><b>✅ Principal: Albany, NY – Northern Boulevard · NACS DC</b><small>Loudon Plaza · 350 Northern Blvd, Albany, NY 12204 · 8 Superchargers · hasta 325 kW · abierto a otros EV. Excelente para cargar antes/después del museo y continuar hacia Plattsburgh.</small><a href=\"https://www.google.com/maps/dir/?api=1&destination=350+Northern+Blvd,+Albany,+NY+12204\" target=\"_blank\">🚗 Ir ahora</a></div><div class=\"evopt good\"><b>✅ Respaldo temprano: Enfield, CT · NACS DC</b><small>65 Palomba Dr, Enfield, CT 06082 · 12 Superchargers · hasta 250 kW · abierto a otros EV. Úsalo solo si sales de casa con menos batería de la prevista o necesitan una pausa.</small><a href=\"https://www.google.com/maps/dir/?api=1&destination=65+Palomba+Dr,+Enfield,+CT+06082\" target=\"_blank\">🚗 Ir ahora</a></div><div class=\"evopt good\"><b>✅ Respaldo al norte de Albany: Clifton Park, NY · NACS DC</b><small>22 Clifton Country Rd, Clifton Park, NY 12065 · 24 Superchargers · hasta 325 kW · abierto a otros EV. Está sobre el corredor hacia Plattsburgh y sirve si Albany está lleno o quieren cargar después de la actividad.</small><a href=\"https://www.google.com/maps/dir/?api=1&destination=22+Clifton+Country+Rd,+Clifton+Park,+NY+12065\" target=\"_blank\">🚗 Ir ahora</a></div><div class=\"evopt backup\"><b>🔌 Noche: La Quinta Inn Plattsburgh · J1772 Level 2</b><small>16 Plaza Blvd · si está disponible, déjalo conectado durante la noche con tu adaptador J1772→NACS.</small><a href=\"https://www.google.com/maps/dir/?api=1&destination=16+Plaza+Blvd,+Plattsburgh,+NY+12901\" target=\"_blank\">🚗 Ir al hotel</a></div></div>", "maps": ["New York State Museum, 222 Madison Ave, Albany, NY 12230", "Empire State Plaza, Albany, NY 12242", "Shepard Park, Canada St, Lake George, NY 12845", "Canada Street, Lake George, NY 12845", "La Quinta Inn & Suites by Wyndham Plattsburgh, 16 Plaza Blvd, Plattsburgh, NY 12901"]}, {"d": "15", "dow": "Sábado", "place": "Lake Placid + Tupper Lake, NY", "emoji": "🎢", "tag": "Montaña rusa alpina + naturaleza vista desde arriba", "img": "Lake Placid, New York.jpg", "credit": "Lake Placid · foto de referencia", "wx": "☀️ 21°C / 10–11°C · mañana fresca", "acts": [["09:00–10:00", "Cliffside Coaster", "Una montaña rusa alpina en Lake Placid: velocidad, curvas y montaña.", "🎢 Gran emoción"], ["13:00–14:00", "The Wild Center + Wild Walk", "Museo de naturaleza y una caminata elevada para ver el bosque desde otra perspectiva.", "🌲 Explorar y descubrir"]], "pack": "Pants 3/4 o mezclilla + playera. Sudadera para la mañana fría.", "hotel": "Regreso a La Quinta Inn & Suites · Plattsburgh", "ev": "<div class=\"evlist\"><div class=\"evopt good\"><b>✅ Principal: Lake Placid Supercharger<\/b><small>1930 Saranac Ave · NACS directo · hasta 250 kW · abierto a no-Tesla. Sal a Tupper Lake con 80%+.<\/small><a href=\"https://www.google.com/maps/search/?api=1&query=Lake+Placid+Supercharger+1930+Saranac+Ave\" target=\"_blank\">Mapa<\/a><\/div><div class=\"evopt good\"><b>✅ Alternativa: Williston VT<\/b><small>31 Market St · NACS directo · hasta 250 kW.<\/small><a href=\"https://www.google.com/maps/search/?api=1&query=Williston+VT+Supercharger+31+Market+St\" target=\"_blank\">Mapa<\/a><\/div><div class=\"evopt backup\"><b>🔌 Olympic Sports Complex · J1772 Level 2<\/b><small>Bob Run Rd, Lake Placid · cargadores J1772 reportados hasta ~7 kW. Útil mientras están en la zona del Cliffside Coaster.<\/small><a href=\"https://www.google.com/maps/search/?api=1&query=Olympic+Sports+Complex+EV+charging+Bob+Run+Rd+Lake+Placid\" target=\"_blank\">Mapa<\/a><\/div><div class=\"evopt backup\"><b>🔌 La Quinta Inn Plattsburgh · J1772 Level 2<\/b><small>De regreso al hotel, puedes recuperar energía lentamente durante la noche.<\/small><a href=\"https://www.google.com/maps/search/?api=1&query=La+Quinta+Inn+Plattsburgh+EV+charging+16+Plaza+Blvd\" target=\"_blank\">Mapa<\/a><\/div><\/div>", "maps": ["Cliffside Coaster, 5486 Cascade Rd, Lake Placid, NY 12946", "The Wild Center, 45 Museum Dr, Tupper Lake, NY 12986"]}, {"d": "16", "dow": "Domingo", "place": "Riparius + Peru, NY", "emoji": "🚲", "tag": "Rail biking junto al Hudson + comida en Pasquale's + piscina del hotel", "img": "Peru, New York.jpg", "credit": "Peru, NY · foto de referencia", "wx": "🌤️ Tarde de verano · revisar clima antes de salir", "acts": [["12:30–14:30", "Revolution Rail · Riparius", "Recorrido familiar en rail bike junto al Hudson. Lleguen con unos 20 minutos de anticipación para check-in y preparación.", "🚲 Actividad principal"], ["Después de Riparius", "Ruta a Peru, NY", "Salimos de Riparius hacia el norte, camino a Plattsburgh, con parada para comer en Peru.", "🚗 Camino a comer"], ["17:00–18:30 aprox.", "Comida en Pasquale's Restaurant and Bar · Peru, NY", "Pizza sencilla para el peque, ensalada y pasta cremosa para los adultos, en el camino de regreso hacia Plattsburgh.", "🍝 Comida en familia"], ["Noche", "Piscina en La Quinta Inn · Plattsburgh", "De vuelta en el hotel: tiempo de piscina para cerrar el día después del rail bike y la comida.", "🏊 Piscina"]], "pack": "Ropa cómoda para pedalear: playera + bermudas/pants ligeros + tenis cerrados. Llevar agua, bloqueador y gorra para Riparius; traje de baño, sandalias y una bolsa para la ropa mojada para la piscina del hotel.", "hotel": "La Quinta Inn & Suites · Plattsburgh", "ev": "<div class=\"evnote\">Día con parada en Riparius y en Peru antes de volver a Plattsburgh. Si amaneces con buena carga, probablemente no necesites una parada dedicada; usa carga de oportunidad solo si hace falta.<\/div><div class=\"evlist\"><div class=\"evopt backup\"><b>🔌 La Quinta Inn Plattsburgh · J1772 Level 2<\/b><small>Última noche en Plattsburgh: buena oportunidad let visible=0;function mark(i){visible=Math.max(0,Math.min(days.length-1,i));document.querySelectorAll('#nav button').forEach((b,j)=>b.classList.toggle('on',j===visible))}function prevDay(){mark(visible-1);document.getElementById('d'+days[visible].d).scrollIntoView({behavior:'smooth'})}function nextDay(){mark(visible+1);document.getElementById('d'+days[visible].d).scrollIntoView({behavior:'smooth'})}function goToday(){let now=new Date(),i=days.findIndex(x=>now.getFullYear()==2026&&now.getMonth()==7&&+x.d==now.getDate());if(i<0)i=visible;mark(i);document.getElementById('d'+days[i].d).scrollIntoView({behavior:'smooth'})}mark(0);const obs=new IntersectionObserver(es=>es.filter(e=>e.isIntersecting).forEach(e=>{let i=days.findIndex(x=>'d'+x.d===e.target.id);if(i>=0)mark(i)}),{rootMargin:'-25% 0px -60%'});document.querySelectorAll('.day').forEach(d=>obs.observe(d));
