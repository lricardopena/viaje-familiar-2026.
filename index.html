<script>
const IMG=(name,w=1100)=>`https://commons.wikimedia.org/wiki/Special:Redirect/file/${encodeURIComponent(name)}?width=${w}`;
const go=q=>{let a=Array.isArray(q)?q:[q];if(a.length>1)return 'https://www.google.com/maps/dir/'+a.map(encodeURIComponent).join('/');return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a[0])+'&travelmode=driving'};
const see=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(Array.isArray(q)?q[q.length-1]:q);
function dayRoute(x){let list=[],push=addr=>{if(list[list.length-1]!==addr)list.push(addr)};x.maps.forEach(m=>(Array.isArray(m)?m:[m]).forEach(push));let hotel=hotelDests[x.d];(Array.isArray(hotel)?hotel:hotel?[hotel]:[]).forEach(addr=>{if(!list.includes(addr))push(addr)});return list}
function mustSeeRoute(x){let list=[],push=addr=>{if(list[list.length-1]!==addr)list.push(addr)};x.acts.forEach((a,idx)=>{if(a[4]!=='star')return;let dest=(activityDests[x.d]||[])[idx]||x.maps[idx]||x.maps[0];(Array.isArray(dest)?dest:[dest]).forEach(push)});let hotel=hotelDests[x.d];(Array.isArray(hotel)?hotel:hotel?[hotel]:[]).forEach(addr=>{if(!list.includes(addr))push(addr)});return list}
function wicon(s){for(const x of ['⛈️','🌧️','🌦️','🌤️','☀️','☁️'])if(s.includes(x))return x;return '🌤️'}
function clothes(p){p=p.toLowerCase();let a=[];if(p.includes('bermuda'))a.push('🩳');if(p.includes('pants')||p.includes('mezclilla'))a.push('👖');if(p.includes('playera'))a.push('👕');if(p.includes('sudadera')||p.includes('chamarra')||p.includes('rompevientos'))a.push('🧥');if(p.includes('lluvia')||p.includes('impermeable'))a.push('🌧️');if(p.includes('tenis')||p.includes('calzado'))a.push('👟');if(p.includes('gorra'))a.push('🧢');return a.slice(0,6).join(' ')||'🎒'}
function actIcon(a){let s=(a[1]+' '+a[3]).toLowerCase();if(s.includes('coaster'))return '🎢';if(s.includes('wild')||s.includes('vins'))return '🦅';if(s.includes('chasm')||s.includes('falls')||s.includes('gorge'))return '💦';if(s.includes('ben'))return '🍦';if(s.includes('cider'))return '🍎';if(s.includes('gondola'))return '🚡';if(s.includes('story'))return '🏰';if(s.includes('lego'))return '🧱';if(s.includes('cog'))return '🚂';if(s.includes('farm'))return '🐄';if(s.includes('piscina'))return '🏊';if(s.includes('comida')||s.includes('restaurant'))return '🍝';if(s.includes('golf'))return '⛳';if(s.includes('ferry'))return '⛴️';if(s.includes('hotel')||s.includes('resort'))return '🏨';if(s.includes('ruta'))return '🚙';return '⭐'}
function excite(a){let s=(a[1]+' '+a[3]).toLowerCase();if(/coaster|tirolesa|balsa|cog|gondola/.test(s))return 4;if(/story|wild|vins|chasm|gorge|lego/.test(s))return 3;return 2}
function expectation(x){let t=x.tag.toLowerCase();if(t.includes('lluv')||x.wx.includes('🌦️')||x.wx.includes('🌧️'))return 'Puede cambiar el clima: mochila lista y plan flexible.';if(t.includes('montaña')||t.includes('góndola'))return 'Habrá vistas altas y puede sentirse más fresco arriba.';if(t.includes('animales'))return 'Vamos a observar animales y aprender cosas nuevas.';if(t.includes('carretera'))return 'Tendremos trayecto largo: snacks, agua y descansos.';if(t.includes('piscina'))return 'Después del rail bike y la comida, cerramos el día con tiempo libre en la piscina.';if(t.includes('legoland'))return 'Día completo en LEGOLAND: salimos temprano, aprovechamos el parque y volvemos a casa esa misma noche.';return 'Un día para explorar a nuestro ritmo y disfrutar en familia.'}
function mission(x){let s=x.place.toLowerCase();if(s.includes('riparius'))return ['🚲 Cuenta las vías del rail bike','🌉 Busca un puente sobre el río','🏊 Salta a la piscina al final del día'];if(s.includes('lake placid'))return ['🔎 Busca 3 montañas','🌲 Cuenta 5 árboles','🎢 Elige tu curva favorita'];if(s.includes('ausable'))return ['💧 Encuentra una cascada','🪨 Busca una roca gigante','🌿 Mira 3 tonos de verde'];if(s.includes('waterbury'))return ['🍦 Elige un sabor','🍎 Encuentra algo de manzana','🚙 Ayuda a ver señales'];if(s.includes('stowe'))return ['🚡 Mira qué pequeño se ve todo','💦 Encuentra la cascada','🏔️ Busca la cima'];if(s.includes('story'))return ['🏰 Encuentra un castillo','🎠 Elige 3 juegos','📸 Foto divertida'];if(s.includes('legoland'))return ['🧱 Construye algo nuevo','🐉 Encuentra un dragón LEGO','🏙️ Busca tu ciudad favorita en Miniland'];if(s.includes('cog'))return ['🚂 Escucha el tren','☁️ Mira las nubes','🏔️ Busca la cima'];if(s.includes('woodstock'))return ['🐄 Busca una vaca','🌻 Encuentra una flor','🏘️ Mira casas antiguas'];if(s.includes('quechee'))return ['🦅 Busca un ave','🌉 Mira el puente','🍃 Encuentra una hoja especial'];return ['📸 Toma una foto','👀 Busca algo nuevo','⭐ Elige tu momento favorito']}
function story(x){let names=x.acts.map(a=>a[1]).slice(0,3).join(', ');return `Hoy vamos a <b>${names}</b>. ${expectation(x)} Al final del día puedes elegir tu momento favorito.`}
const{days,activityDests,hotelDests}=TRIP_DATA;
// Enlaces al Theme Park Companion (assets/theme-park-core.js) por nombre exacto
// de actividad — cada parque nuevo solo agrega una entrada acá, no requiere
// tocar la lógica de renderizado. Ver specs/SPECIFICATIONS.md.asc sección 22.
const COMPANION_LINKS={
  'Story Land':{href:'storyland.html',label:'🎢 Abrir plan interactivo de Story Land'},
  'LEGOLAND New York':{href:'legoland.html',label:'🧱 Abrir plan interactivo de LEGOLAND'},
};
const SEL_KEY='viajeSelectedDays';
let selectedDays=new Set([0]);
let anchorIndex=0;
function loadSelection(){try{const raw=sessionStorage.getItem(SEL_KEY);if(!raw)return null;const arr=JSON.parse(raw);if(!Array.isArray(arr))return null;const valid=[...new Set(arr.filter(i=>Number.isInteger(i)&&i>=0&&i<days.length))];return valid.length?valid:null}catch(e){return null}}
function saveSelection(){try{sessionStorage.setItem(SEL_KEY,JSON.stringify([...selectedDays]))}catch(e){}}
function updateVisibleDays(scrollTo){
  if(selectedDays.size===0)selectedDays.add(Math.min(Math.max(anchorIndex,0),days.length-1));
  document.querySelectorAll('#days .day').forEach((el,i)=>el.classList.toggle('is-hidden',!selectedDays.has(i)));
  document.querySelectorAll('#nav button.dayBtn').forEach((b,i)=>{let on=selectedDays.has(i);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')});
  let allBtn=document.getElementById('allDaysBtn');
  if(allBtn){let on=selectedDays.size===days.length;allBtn.classList.toggle('on',on);allBtn.setAttribute('aria-pressed',on?'true':'false')}
  saveSelection();
  if(scrollTo!=null){let el=document.getElementById('d'+days[scrollTo].d);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
}
function toggleDay(i){
  anchorIndex=i;
  if(selectedDays.has(i)){
    if(selectedDays.size>1){selectedDays.delete(i);updateVisibleDays()}
  }else{selectedDays.add(i);updateVisibleDays(i)}
}
function selectAll(){days.forEach((_,i)=>selectedDays.add(i));updateVisibleDays()}
function selectOnly(i){anchorIndex=i;selectedDays=new Set([i]);updateVisibleDays(i)}
function prevDay(){selectOnly((anchorIndex-1+days.length)%days.length)}
function nextDay(){selectOnly((anchorIndex+1)%days.length)}
function goToday(){let now=new Date(),i=days.findIndex(x=>now.getFullYear()==2026&&now.getMonth()==7&&+x.d==now.getDate());if(i<0)i=anchorIndex;selectOnly(i)}
{
const nav=document.getElementById('nav'),root=document.getElementById('days');
days.forEach((x,i)=>{let nb=document.createElement('button');nb.type='button';nb.className='dayBtn';nb.innerHTML=`<div>${x.dow.slice(0,3)}</div><strong>${x.d}</strong>`;nb.setAttribute('aria-pressed','false');nb.onclick=()=>toggleDay(i);nav.appendChild(nb);
