<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ed7d24"><title>Story Land · Plan interactivo</title>
<link rel="stylesheet" href="auth.css">
<script src="auth.js"></script>
<style>
:root{--ink:#183247;--muted:#607887;--blue:#1579c5;--green:#2a915a;--orange:#ed7d24;--red:#d9432f;--pink:#d9427e;--yellow:#ffd85b;--bg:#f6f7f2;--card:#fff;--line:#dbe7ec;--shadow:0 10px 28px #17445c18}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:auto;padding:0 max(12px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,#ed7d24,#d9601c);color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-top));margin:0 -12px 12px;box-shadow:var(--shadow)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{color:#fff;text-decoration:none;font-weight:900;font-size:.82rem;background:#ffffff30;padding:8px 11px;border-radius:12px;white-space:nowrap}
.top h1{font-size:1.15rem;margin:0;text-align:center;flex:1}
.progress{margin-top:10px}
.pbar{height:10px;border-radius:99px;background:#ffffff35;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.progress .stats{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;opacity:.95}
.mustbar{margin-top:8px;background:#ffffff22;border-radius:12px;padding:7px 10px;font-size:.78rem;font-weight:900;display:flex;justify-content:space-between}

.tabpane{display:none}
.tabpane.on{display:block}

.banner{border-radius:18px;padding:12px 14px;margin-bottom:12px;font-size:.85rem;font-weight:700;box-shadow:var(--shadow)}
.banner.lunch{background:#fff3dc;border:1px solid #f0d38a}
.banner.water{background:#e4f5ff;border:1px solid #a9dcf5}
.banner b{display:block;font-size:.95rem;margin-bottom:3px}
.banner ul{margin:6px 0 0;padding-left:18px}
.banner.calmnotice{background:#f1ecff;border:1px solid #cdbdf7;display:flex;align-items:center;justify-content:space-between;gap:10px}

.nowcard{background:linear-gradient(160deg,#fff,#fff8ef);border:1px solid #f2ddb8;border-radius:26px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.nowcard .kicker{display:inline-block;background:var(--orange);color:#fff;font-weight:950;font-size:.78rem;letter-spacing:.04em;padding:6px 12px;border-radius:999px}
.nowcard h2{font-size:1.7rem;margin:12px 0 6px;line-height:1.08}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.tag{background:#eef4f6;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.72rem;font-weight:850;white-space:nowrap}
.tag.hot{background:#ffe3d8;border-color:#f5b78e;color:#b8471a}
.tag.star{background:#fff3c2;border-color:#eecf6a;color:#8a6a05}
.whybox{background:#f4f8f4;border-radius:14px;padding:10px 12px;font-size:.86rem;margin-bottom:8px}
.whybox b{color:var(--green)}
.factrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fact{background:#f6f7f2;border-radius:14px;padding:9px 10px;font-size:.78rem}
.fact b{display:block;font-size:.9rem;margin-top:2px}
.priohigh{color:#b8471a}.priomed{color:#8a6a05}.priolow{color:#3d6e57}.priorepeat{color:var(--pink)}
.tipline{background:#fff9e0;border:1px dashed #eecf6a;border-radius:12px;padding:9px 11px;font-size:.82rem;margin-bottom:12px}
.actionsgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.actbtn{min-height:58px;border:0;border-radius:16px;font-weight:950;font-size:.86rem;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;padding:6px}
.actbtn.done{background:var(--green);color:#fff}
.actbtn.skip{background:#edf2f4;color:var(--ink);border:1px solid var(--line)}
.actbtn.repeat{background:#ffe1ee;color:#a41457;border:1px solid #f5b9d4}
.actbtn.long{background:#fff0e0;color:#a4530a;border:1px solid #f0c896}
.actbtn.map{background:#e4f5ff;color:#0b5e8e;border:1px solid #a9dcf5;grid-column:1/-1}

.reactcard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);text-align:center}
.reactcard h2{margin:6px 0 4px;font-size:1.25rem}
.reactcard p{color:var(--muted);font-size:.86rem;margin:0 0 14px}
.reactopts{display:grid;gap:9px}
.reactopts button{min-height:56px;border-radius:16px;border:1px solid var(--line);background:#f6f7f2;font-weight:900;font-size:.92rem}

.donebig{background:#eafaf0;border:1px solid #b8e6c8;border-radius:24px;padding:22px;text-align:center;box-shadow:var(--shadow)}
.donebig .emoji{font-size:2.6rem}

.calmtoggle{display:block;width:100%;margin-top:14px;min-height:52px;border-radius:16px;border:1px solid var(--line);background:#f1ecff;color:#5b3ea8;font-weight:900}
.calmtoggle.active{background:#5b3ea8;color:#fff}

.miniSectTitle{margin:18px 2px 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:#657d8a;font-weight:950}
.minilist{display:grid;gap:8px}
.miniitem{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:.84rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.miniitem small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}
.pill{font-size:.68rem;font-weight:900;background:#f4f6f7;padding:4px 8px;border-radius:999px;white-space:nowrap}

.zonebadge{display:inline-flex;align-items:center;gap:5px;background:#eef7f0;color:#1a7a44;border:1px solid #bfe6cc;border-radius:999px;padding:5px 11px;font-size:.74rem;font-weight:850;margin-bottom:8px}
.maporient{display:flex;align-items:center;gap:10px;background:#f4f8fb;border:1px solid #d7e6ee;border-radius:14px;padding:8px 10px;margin-bottom:10px}
.mapgrid{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px}
.mapgrid-box{width:44px;height:36px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);background:#e3edf3;border:1px solid #c3d8e2;border-radius:6px;padding:3px;gap:2px}
.mapgrid-dot{width:100%;height:100%;border-radius:3px;background:var(--orange);align-self:center;justify-self:center;min-width:8px;min-height:8px}
.mapgrid-entrance{font-size:.58rem;color:var(--muted);font-weight:800;white-space:nowrap}
.maporienttext{font-size:.78rem;line-height:1.4}
.maporienttext div{margin:1px 0}
.reasonrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.reasonchip{background:#f4f0ff;color:#5b3ea8;border:1px solid #d8caf5;border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:800}
.banner.zonehint{background:#fff3dc;border:1px solid #f0d38a;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.banner.zonehint button{min-height:38px;border:0;border-radius:11px;background:#a4530a;color:#fff;font-weight:900;padding:6px 12px;font-size:.76rem;white-space:nowrap}
.banner.zoneclose{background:#eef7f0;border:1px solid #bfe6cc}

.miniSectTitle.alts{margin-top:22px}
.altgrid{display:grid;gap:9px}
.altcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px}
.altname{font-weight:900;font-size:.9rem}
.altmeta{font-size:.72rem;color:var(--muted);margin-top:2px}
.altcard .reasonrow{margin:7px 0 0}
.altbtns{display:flex;gap:8px;margin-top:8px}
.altbtns button{flex:1;min-height:40px;border-radius:11px;border:1px solid var(--line);background:#f8f9f7;font-weight:800;font-size:.85rem}

.catblock{margin-bottom:18px}
.catblock h3{font-size:.95rem;margin:0 0 9px;display:flex;align-items:center;gap:6px}
.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px 12px;margin-bottom:8px}
.item .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;cursor:pointer;min-height:32px}
.item h4{margin:0;font-size:.95rem;display:flex;align-items:center;gap:6px}
.item h4 .expandicon{font-size:.7rem;color:var(--muted);transition:transform .15s}
.item .expandbox{margin-top:8px;padding-top:9px;border-top:1px dashed var(--line)}
.item .expandbox .whybox{margin-bottom:8px}
.item .expandbox .factrow{margin:0}
.statusChip{font-size:.68rem;font-weight:900;padding:4px 9px;border-radius:999px;white-space:nowrap}
.st-pending{background:#eef1f2;color:#657d8a}
.st-done{background:#dff3e6;color:#1a7a44}
.st-skipped{background:#f1eee6;color:#8a7548}
.st-later{background:#ffe6d4;color:#a4530a}
.st-repeat{background:#ffe1ee;color:#a41457}
.item .tagrow{margin:7px 0}
.itemzone{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.72rem;color:var(--muted);margin:2px 0 4px}
.zonemapbtn{background:none;border:0;color:var(--blue);font-weight:850;font-size:.72rem;padding:2px 4px;white-space:nowrap}
.itembtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.itembtns button{min-height:42px;border-radius:11px;border:1px solid var(--line);background:#f8f9f7;font-size:1rem}
.itembtns button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.favempty{text-align:center;padding:40px 16px;color:var(--muted)}
.favempty .emoji{font-size:2.4rem;display:block;margin-bottom:8px}

.tipsList{display:grid;gap:9px}
.tipitem{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 13px;font-size:.86rem;display:flex;gap:10px;align-items:flex-start}
.tipitem span.ic{font-size:1.2rem}
.resetbtn{display:block;width:100%;margin-top:18px;min-height:52px;border-radius:16px;border:1px solid #f0b3a8;background:#fff2ef;color:#b8291a;font-weight:900}

.mapblock{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:18px;box-shadow:var(--shadow)}
.mapbig{display:block;width:100%;min-height:58px;border-radius:16px;border:0;background:linear-gradient(135deg,#1579c5,#0b5e8e);color:#fff;font-weight:950;font-size:.92rem;margin-bottom:10px}
.mapnote{font-size:.78rem;color:var(--muted);margin:0 0 10px}
.zoneguide{background:#f6f7f2;border-radius:14px;padding:10px 12px;font-size:.82rem}
.zoneguide b{display:block;margin-bottom:4px}
.zoneguide ul{margin:4px 0 0;padding-left:18px}

.fab{position:fixed;z-index:45;right:max(14px,env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom));background:var(--orange);color:#fff;border:0;border-radius:999px;padding:13px 18px;font-weight:950;box-shadow:0 8px 20px #ed7d2450;display:none}
.fab.show{display:block}

body.noscroll{position:fixed;left:0;right:0;width:100%;overflow:hidden}

/* ---------- Visor de mapa (full-screen sheet) ----------
   Único componente reutilizable para "Ver en el mapa" en toda la app
   (recomendación actual, checklist, favoritas, alternativas y el bloque
   general de Tips) — ver openParkMap(attractionId) más abajo. z-index 500
   queda muy por encima del header/FAB/bottom nav (≤45) pero por debajo del
   overlay de login (9999 en auth.css), que siempre debe ganar. */
.mapsheet{position:fixed;left:0;right:0;top:0;height:100dvh;z-index:500;visibility:hidden;pointer-events:none}
.mapsheet.show{visibility:visible;pointer-events:auto}
.mapsheet-backdrop{position:absolute;inset:0;background:#0b1b2680;opacity:0;transition:opacity .22s ease}
.mapsheet.show .mapsheet-backdrop{opacity:1}
.mapsheet-panel{position:absolute;left:0;right:0;top:0;height:100dvh;background:#fff;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.mapsheet.show .mapsheet-panel{transform:translateY(0)}
.mapsheet-header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:linear-gradient(135deg,#1579c5,#0b5e8e);color:#fff}
.mapsheet-close{min-height:48px;min-width:48px;padding:0 16px;border:0;border-radius:13px;background:#ffffff26;color:#fff;font-weight:900;font-size:.9rem;white-space:nowrap}
.mapsheet-title{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;line-height:1.25}
.mapsheet-title b{font-size:.92rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapsheet-titlesub{font-size:.74rem;font-weight:800;opacity:.92}
.mapsheet-external{flex:0 0 auto;color:#fff;text-decoration:none;font-size:1.15rem;padding:8px;border-radius:11px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.mapsheet-help{flex:0 0 auto;background:#fff7e4;border-bottom:1px solid #f0d38a}
.mapsheet-helphead{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;background:none;text-align:left}
.mapsheet-helpinfo{flex:1;min-width:0}
.mapsheet-helpname{font-size:.78rem;font-weight:850;color:#8a6a05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapsheet-helpbig{font-size:1.15rem;font-weight:950;color:#8a4805;letter-spacing:.01em}
.mapsheet-helpchevron{flex:0 0 auto;font-weight:900;color:#8a6a05;transition:transform .2s;font-size:1rem}
.mapsheet-help.collapsed .mapsheet-helpchevron{transform:rotate(-90deg)}
.mapsheet-helpbody{padding:0 14px 12px;font-size:.82rem;color:#5a4207;display:flex;flex-direction:column;gap:4px}
.mapsheet-help.collapsed .mapsheet-helpbody{display:none}
.mapsheet-viewer{flex:1;position:relative;min-height:0;background:#eef2f4}
.mapsheet-viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapsheet-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#eef2f4;font-size:.82rem;font-weight:800;color:var(--muted)}
.mapsheet-loading[hidden]{display:none}
.mapsheet-loading .spinner{width:34px;height:34px;border-radius:99px;border:4px solid #cfe0e8;border-top-color:var(--blue);animation:mapspin .8s linear infinite}
@keyframes mapspin{to{transform:rotate(360deg)}}
.mapsheet-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:#fff}
.mapsheet-fallback[hidden]{display:none}
.mapsheet-fallback .emoji{font-size:2.4rem}
.mapsheet-fallback p{margin:0;font-weight:800;color:var(--ink);max-width:280px}
.mapsheet-fallback a{background:var(--blue);color:#fff;text-decoration:none;font-weight:900;padding:12px 18px;border-radius:13px}
.mapsheet-footer{flex:0 0 auto;padding:8px 14px calc(10px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line)}
.mapsheet-footer a{color:var(--blue);text-decoration:none;font-weight:850;font-size:.8rem}

.bottom{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));width:min(calc(100% - 20px),560px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;background:#ffffffee;border:1px solid #d4e2e8;border-radius:18px;backdrop-filter:blur(12px);box-shadow:0 6px 24px #133f5828}
.bottom button{min-height:56px;border:0;border-radius:12px;background:#fff;color:var(--ink);font-weight:900;font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.bottom button .bi{font-size:1.25rem}
.bottom button.on{background:var(--orange);color:#fff}
@media(max-width:360px){.factrow{grid-template-columns:1fr}.actionsgrid{grid-template-columns:1fr}}
</style></head><body>
<main class="app protected-content">
<div class="top">
<div class="row"><a class="back" href="index.html">← Itinerario</a><h1>🏰 Story Land</h1><span style="width:70px"></span></div>
<div class="progress"><div class="stats"><span id="progTxt">0 de 18 · 0%</span><span id="mustTxt">🔥 0/7</span></div><div class="pbar"><i id="progBar" style="width:0%"></i></div></div>
</div>

<section class="tabpane" id="tab-ahora"></section>
<section class="tabpane" id="tab-checklist"></section>
<section class="tabpane" id="tab-favoritas"></section>
<section class="tabpane" id="tab-tips"></section>

</main>
<button class="fab protected-content" id="fabNext" onclick="goAhora()">⭐ ¿QUÉ SIGUE?</button>
<div class="bottom protected-content">
<button id="navAhora" onclick="setTab('ahora')"><span class="bi">⭐</span>Ahora</button>
<button id="navChecklist" onclick="setTab('checklist')"><span class="bi">☑️</span>Checklist</button>
<button id="navFavoritas" onclick="setTab('favoritas')"><span class="bi">❤️</span>Favoritas</button>
<button id="navTips" onclick="setTab('tips')"><span class="bi">ℹ️</span>Tips</button>
</div>

<div class="mapsheet" id="mapSheet" role="dialog" aria-modal="true" aria-labelledby="mapSheetTitleMain" aria-hidden="true">
  <div class="mapsheet-backdrop" onclick="closeParkMap()"></div>
  <div class="mapsheet-panel" role="document">
    <div class="mapsheet-header">
      <button class="mapsheet-close" id="mapSheetClose" onclick="closeParkMap()">← Cerrar</button>
      <div class="mapsheet-title">
        <b id="mapSheetTitleMain">🗺️ Mapa oficial de Story Land</b>
        <span class="mapsheet-titlesub" id="mapSheetTitleSub"></span>
      </div>
      <a class="mapsheet-external" id="mapSheetExternalTop" href="#" target="_blank" rel="noopener noreferrer" aria-label="Abrir mapa completo en pestaña nueva" title="Abrir mapa completo en pestaña nueva">↗️</a>
    </div>
    <div class="mapsheet-help" id="mapSheetHelp" hidden>
      <button class="mapsheet-helphead" id="mapSheetHelpToggle" onclick="toggleMapHelp()" aria-expanded="true" aria-controls="mapSheetHelpBody">
        <div class="mapsheet-helpinfo">
          <div class="mapsheet-helpname" id="mapSheetHelpName"></div>
          <div class="mapsheet-helpbig" id="mapSheetHelpBig"></div>
        </div>
        <span class="mapsheet-helpchevron" aria-hidden="true">▾</span>
      </button>
      <div class="mapsheet-helpbody" id="mapSheetHelpBody"></div>
    </div>
    <div class="mapsheet-viewer">
      <div class="mapsheet-loading" id="mapSheetLoading"><div class="spinner" aria-hidden="true"></div><span>Cargando el mapa…</span></div>
      <iframe id="mapSheetFrame" title="Park Map oficial de Story Land" loading="lazy"></iframe>
      <div class="mapsheet-fallback" id="mapSheetFallback" hidden>
        <span class="emoji" aria-hidden="true">🗺️</span>
        <p>No pudimos mostrar el mapa dentro de la app.</p>
        <a id="mapSheetFallbackLink" href="#" target="_blank" rel="noopener noreferrer">Abrir mapa oficial ↗</a>
      </div>
    </div>
    <div class="mapsheet-footer">
      <a id="mapSheetExternalBottom" href="#" target="_blank" rel="noopener noreferrer">Abrir mapa completo ↗</a>
    </div>
  </div>
</div>

<script>
/* ---------- Datos de atracciones ----------
   Metadata geográfica (zone/mapNumber/nearbyAttractions):
   - zone: agrupación lógica usada para "proximidad" (evitar cruzar el parque
     de un lado a otro). "Dinosaurios" se apoya en la sección oficial
     "Dinosaur Themed section" (confirmada por Story Land al describir
     Roar-O-Saurus); "Granja" se apoya en la "barnyard-themed section"
     (confirmada al describir Farm Tractors/Crazy Barn). El resto son
     agrupaciones razonables por tema para planear la ruta, no coordenadas
     verificadas — no hacía falta GPS, solo evitar caminatas tontas.
   - mapNumber: número visible en el Park Map oficial 2026 (fuente: la tabla
     oficial 2026 que proporcionó el usuario — en su momento el dominio de
     PARK_MAP_URL estaba bloqueado en el entorno de desarrollo y no pudimos
     abrir el PDF nosotros mismos, así que estos números venían
     exclusivamente de esa tabla, no de una búsqueda ni de una suposición.
     2026-08: el usuario adjuntó el PDF directamente; vive local en
     assets/park-map/ y el visor interno (ver openParkMap más abajo) lo
     embebe desde ahí — evita depender de que ese dominio externo esté
     disponible. PARK_MAP_URL se conserva como referencia del sitio
     oficial. Los números de esta lista no se re-verificaron contra las
     páginas del PDF, siguen siendo los de la tabla). Corregidos 2026-08:
     varias atracciones tenían el número de una numeración anterior/errónea
     (ver commit para la lista antes→después). Turtle Twirl y Crazy Barn,
     que antes se dejaban en null porque no aparecían en el mapa que
     teníamos, ya están en la tabla oficial (#42 y #11) y se rellenaron.
   - nearbyAttractions: otras atracciones de la misma zona lógica, usadas
     para el bonus de proximidad y para el aviso "hay otra cerca".
   - mapRegion/visualLandmark/nearbyMapNumbers: referencia visual rápida
     para ubicarse en el Park Map oficial (celda de una cuadrícula 3×3
     "front/center/back" × "left/center/right", una frase de referencia,
     y números de otras atracciones cercanas). No pudimos verificar la
     disposición física real del PDF 2026 (mismo bloqueo de red de arriba),
     así que estos campos NO se tocaron en la corrección de números — siguen
     siendo agrupaciones razonables por tema, no coordenadas confirmadas
     contra el mapa 2026. Si alguien confirma la disposición real mirando
     el mapa impreso, se puede corregir aquí. La UI debe funcionar

  }else{

  }

  document.getElementById('mapSheetFallbackLink').href=PARK_MAP_PDF;
  document.getElementById('mapSheetFallback').hidden=true;
  frame.hidden=false;
  if(frame.src.indexOf(PARK_MAP_PDF)===-1){
    document.getElementById('mapSheetLoading').hidden=false;
    clearTimeout(mapLoadTimer);
    mapLoadTimer=setTimeout(showMapFallback,9000);

  }else{

  document.body.classList.add('noscroll');

  requestAnimationFrame(()=>document.getElementById('mapSheetClose').focus());
}
function closeParkMap(){
  const sheet=document.getElementById('mapSheet');
  if(!sheet.classList.contains('show'))return; // evita restaurar scroll dos veces si se cierra repetido
  sheet.classList.remove('show');
  sheet.setAttribute('aria-hidden','true');
  document.removeEventListener('keydown',onMapKeydown);
  document.body.classList.remove('noscroll');
  document.body.style.top='';
  window.scrollTo(0,mapPrevScrollY);
  if(mapPrevFocus&&typeof mapPrevFocus.focus==='function')mapPrevFocus.focus();
}

/* ---------- Estado / localStorage ----------
   Se mantiene la misma clave "storyland_state_v1" (en vez de crear una nueva
   "viaje2026_storyland_state") porque el viaje ya está en curso y cambiar de
   clave perdería el progreso guardado en el teléfono de la familia a mitad
   del día. Todo lo nuevo (currentZone/deferred/recommendationCount) vive
   dentro de este mismo objeto — sin claves de localStorage adicionales. */
const KEY='storyland_state_v1';
function loadState(){
  let s;
  try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){s=null}
  if(!s||typeof s!=='object')s={};
  if(!s.status)s.status={};
  if(!('polarReaction' in s))s.polarReaction=null;
  if(!('calmMode' in s))s.calmMode=false;
  if(!s.startTime)s.startTime=Date.now();
  if(!s.tab)s.tab='ahora';
  if(!('currentZone' in s))s.currentZone=null;       // zona de la última atracción completada/repetida
  if(!('lastCompletedId' in s))s.lastCompletedId=null;
  if(!s.deferred)s.deferred={};                       // id -> {atCount, zone} cuando se marca "fila muy larga"
  if(!('recommendationCount' in s))s.recommendationCount=0; // avanza con cada acción, usado para el cooldown
  if(!s.skipped)s.skipped={};                          // id -> {atCount} cuando se toca "saltar por ahora"
  return s;
}
let state=loadState();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function getStatus(id){return state.status[id]||'pending'}
function setStatus(id,val){state.status[id]=val;save();renderAll()}

/* ---------- Lógica de recomendación ----------
   NO es un itinerario: no hay una secuencia fija de atracciones guardada en
   ningún sitio. Cada vez que se pide "¿Qué sigue?" se recalcula un score
   para TODAS las atracciones todavía no completadas (incluidas las
   marcadas "repeat"), y gana la de mayor score. Cualquier interacción
   (hecho / saltar / fila larga / repetir / reacción a Polar / modo
   tranquilo) cambia el contexto y por tanto puede cambiar quién gana la
   próxima vez — ver renderAll() / setStatus(), que recalculan siempre.

   score = priorityScore(tier) + sameZoneBonus + proximityBonus
           + childAffinityBonus + timeOfDayBonus(agua) + earlyDinoBonus
           + reactionBonus + restBonus - deferredPenalty - skipPenalty

   La prioridad (tier) manda: cada nivel vale TIER_W puntos, y la suma de
   los bonus de contexto normalmente no alcanza un nivel completo — así un
   imperdible pendiente razonablemente cerca sigue ganando a una atracción
   secundaria que está pegada a nosotros. La ubicación/contexto desempata
   entre cosas de prioridad parecida y evita cruzar el parque sin
   necesidad, pero no puede "inventar" prioridad donde no la hay.

   Pesos ajustables aquí abajo — están comentados para que cambiarlos más
   adelante (o durante el día, si algo no se siente bien) sea fácil. */
const TIER_W=100;          // peso de cada nivel de prioridad (factor dominante)
const SAME_ZONE_BONUS=35;  // seguimos en la misma zona que la última atracción
const PROXIMITY_BONUS=15;  // está en la lista "nearbyAttractions" de lo último hecho
const CHILD_BONUS=12;      // atracción marcada como favorita probable del niño
const WATER_BONUS=20;      // agua + hace calor (bonus, no regla obligatoria)
const WATER_BONUS_MOOLAGOON=10; // Moo Lagoon recibe la mitad: es opcional, no debe adelantarse
const EARLY_DINO_BONUS=20; // bloque de dinosaurios tiene más peso en las primeras horas (item 4/3)
const POLAR_FIRST_BONUS=20;// mientras no sepamos la reacción a Polar, probarlo primero tiene sentido
                            // (es el que da la señal que reordena todo lo demás) — deja de aplicar
                            // en cuanto se responde la pregunta de reacción, no es una secuencia fija
const REACTION_LOVE_BOOST=45; // "le encantó Polar" empuja fuerte a Roar mientras dure el ánimo
const AFTER_LUNCH_BONUS=18;   // boost temporal para descanso/tranquilas después del mediodía
// Los cooldowns deben superar el mayor stack de bonus plausible (~115, ver
// arriba) para garantizar que, justo después de saltar/diferir algo, otra
// cosa gane la recomendación en vez de repetir lo mismo.
const DEFERRED_PENALTY=130; // "fila muy larga": penalización temporal (cooldown)
const SKIP_PENALTY=120;     // "saltar por ahora": penalización temporal (cooldown más corto)
const SKIP_COOLDOWN_STEPS=3; // nº de acciones antes de que vuelva a competir con normalidad

/* baseTier(id): prioridad "de catálogo" de una atracción, sin secuencia
   fija — no hay ningún array que imponga un orden dentro de un mismo tier;
   el orden dentro de un tier lo decide el score completo (zona, proximidad,
   afinidad, hora, etc. — ver computeScore). La única dependencia de
   contexto aquí es la reacción a Polar, que baja temporalmente a Roar (item
   4 / escenario D) sin hacerlo desaparecer: sigue siendo candidata, solo
   compite en un nivel más bajo hasta que gane por descarte o cambie el
   contexto. */
function baseTier(id){
  if(['polar','roar','bamboo','raptour','flyingfish'].includes(id))return 0;
  if(id==='antiquecars'||id==='farmtractors')return 1;
  if(id==='drgeyser'||id==='splashbattle')return waterBoostActive()?1.5:2;
  if(id==='roar'&&state.polarReaction==='no')return 2.4;
  if(['pumpkincoach','castle','swanboats','carousel','balloonchase'].includes(id))return 2.6;
  if(id==='moolagoon')return 2.8; // opcional: nunca compite con los imperdibles, aunque haga calor
  if(['loopylab','turtletwirl','crazybarn'].includes(id))return 3;
  if(id==='huffpuff')return 3.2;
  return 4;
}
function waterBoostActive(){
  let hour=new Date().getHours();
  let pendingMust=MUST.filter(id=>getStatus(id)==='pending'||getStatus(id)==='skipped').length;
  return hour>=13 && pendingMust<=3;
}
/* Cuántas atracciones ya se consideran "hechas" (done o repeat) — se usa
   para saber si todavía estamos en las primeras horas del día (item 4). */
function doneTotalCount(){return ALL.filter(a=>['done','repeat'].includes(getStatus(a.id))).length}
/* item 14: después de que ya se resolvieron varios imperdibles y pasado el
   mediodía, las opciones de descanso/tranquilas reciben un empujón
   temporal — sin convertir el almuerzo en una hora fija. */
function afterLunchWindowActive(){
  let mustHandled=MUST.filter(id=>getStatus(id)!=='pending').length;
  let hour=new Date().getHours();
  return mustHandled>=3 && hour>=12;
}
/* item 9: los favoritos para repetir tienen prioridad baja mientras haya
   mucho pendiente, pero ganan relevancia en la última parte del día. */
function isLateDayForFavorites(){
  let hour=new Date().getHours();
  let mustDone=MUST.filter(id=>['done','repeat'].includes(getStatus(id))).length;
  return hour>=15 || mustDone>=MUST.length-1;
}
/* Tier "efectivo" usado por el motor de recomendación: igual a baseTier()
   salvo para las atracciones marcadas "repeat", que quedan en un nivel bajo
   (para no forzar la repetición) pero pueden subir mucho al final del día
   o si estamos justo en su zona (via sameZoneBonus/proximityBonus, que se
   aplican igual sobre cualquier tier). */
function effectiveTier(a){
  if(getStatus(a.id)==='repeat')return isLateDayForFavorites()?1.4:3.4;
  return baseTier(a.id);
}
/* ----- cooldown para "fila muy larga" (item 8) -----
   No calculamos minutos: contamos acciones. Mientras no hayan pasado al
   menos 2 acciones desde que se difirió Y sigamos en la misma zona, la
   atracción recibe DEFERRED_PENALTY y deja de ser la recomendación
   automática — pero sigue en la lista (no desaparece) y se puede
   "revisar la fila" a mano en cualquier momento. */
function deferredInfo(id){return state.deferred&&state.deferred[id]}
function isOnCooldown(id){
  let d=deferredInfo(id);
  if(!d)return false;
  let recDelta=state.recommendationCount-d.atCount;
  let zoneChanged=state.currentZone&&d.zone&&state.currentZone!==d.zone;
  return recDelta<2&&!zoneChanged;
}
/* ----- cooldown para "saltar por ahora" -----
   Igual mecánica que el cooldown de fila larga (por conteo de acciones, no
   minutos), pero sin depender de la zona: saltar no dice nada de por qué,
   así que simplemente deja de ser la recomendación top durante
   SKIP_COOLDOWN_STEPS acciones y después vuelve a competir normal. Así el
   botón "SALTAR POR AHORA" sí hace avanzar a la siguiente recomendación en
   vez de repetir la misma atracción. */
function skippedInfo(id){return state.skipped&&state.skipped[id]}
function isOnSkipCooldown(id){
  let d=skippedInfo(id);
  if(!d)return false;
  return state.recommendationCount-d.atCount<SKIP_COOLDOWN_STEPS;
}
function sameZoneBonus(a){return state.currentZone&&a.zone===state.currentZone?SAME_ZONE_BONUS:0}
function proximityBonus(a){
  let lastId=state.lastCompletedId;
  if(!lastId||!BY_ID[lastId])return 0;
  return BY_ID[lastId].nearbyAttractions.includes(a.id)?PROXIMITY_BONUS:0;
}
function childBonus(a){return CHILD_FAVORITE_IDS.includes(a.id)?CHILD_BONUS:0}
function timeOfDayBonus(a){
  if(!waterBoostActive()||!WATER_IDS.includes(a.id))return 0;
  return a.id==='moolagoon'?WATER_BONUS_MOOLAGOON:WATER_BONUS;
}
/* item 3/4: el bloque de dinosaurios pesa más en las primeras horas, y
   Polar específicamente mientras no sepamos su reacción (es el que decide
   cómo seguir) — ninguno de los dos es una secuencia impuesta, son bonus de
   contexto que compiten con todo lo demás como cualquier otro. */
function earlyDinoBonus(a){
  if(!DINO_IDS.includes(a.id))return 0;
  let bonus=doneTotalCount()<3?EARLY_DINO_BONUS:0;
  if(a.id==='polar'&&state.polarReaction===null)bonus+=POLAR_FIRST_BONUS;
  return bonus;
}
function reactionBonus(a){
  if(a.id==='roar'&&state.polarReaction==='love')return REACTION_LOVE_BOOST;
  return 0;
}
function restBonus(a){
  if(!afterLunchWindowActive())return 0;
  return (a.cat==='descanso'||CALM_IDS.includes(a.id))?AFTER_LUNCH_BONUS:0;
}
function computeScore(a){
  let tier=effectiveTier(a);
  let priorityScore=(5-tier)*TIER_W;
  let deferredPenalty=isOnCooldown(a.id)?DEFERRED_PENALTY:0;
  let skipPenalty=isOnSkipCooldown(a.id)?SKIP_PENALTY:0;
  return priorityScore+sameZoneBonus(a)+proximityBonus(a)+childBonus(a)+timeOfDayBonus(a)
    +earlyDinoBonus(a)+reactionBonus(a)+restBonus(a)-deferredPenalty-skipPenalty;
}
/* candidateList(): TODO lo que no esté "done" — incluye "repeat", para que
   los favoritos puedan volver a competir más adelante (item 9) en vez de
   desaparecer del todo. Se recalcula por completo en cada llamada: no hay
   itinerario guardado, solo el estado actual de cada atracción. */
function candidateList(){
  return ALL.filter(a=>getStatus(a.id)!=='done')
    .map(a=>({...a,tier:effectiveTier(a),score:computeScore(a),deferred:isOnCooldown(a.id),skipCooldown:isOnSkipCooldown(a.id)}))
    .sort((a,b)=>b.score-a.score||a._i-b._i);
}
/* candidatePool(): candidateList() ya filtrado por modo tranquilo si está
   activo. Único punto que usan tanto getRecommendation() como
   getAlternatives(), para que la recomendación principal y las alternativas
   salgan siempre del mismo conjunto/orden. */
function candidatePool(){
  let list=candidateList();
  if(state.calmMode){
    let calm=list.filter(a=>CALM_IDS.includes(a.id));
    if(calm.length)return calm;
  }
  return list;
}
function getRecommendation(){
  let list=candidatePool();
  return list.length?list[0]:null;
}
/* item 10: como máximo dos alternativas, calculadas con el mismo motor de
   scoring — nunca una lista larga. */
function getAlternatives(rec){
  if(!rec)return [];
  return candidatePool().filter(a=>a.id!==rec.id).slice(0,2);
}
function whyNow(a){
  let status=getStatus(a.id);
  if(status==='repeat'){
    return state.currentZone&&state.currentZone===a.zone
      ? 'La habían marcado para repetir y están justo en esta zona — buen momento antes de seguir.'
      : 'La habían marcado para repetir y ya casi terminan el plan — vale la pena volver antes de irse.';
  }
  if(a.id==='roar'){
    if(state.polarReaction==='love')return '¡Le encantó Polar Coaster! Aprovechamos el ánimo con Roar-O-Saurus.';
    if(state.polarReaction==='ok')return 'Estuvo bien en Polar Coaster. Roar-O-Saurus es un poco más intensa — pueden intentarlo cuando quieran.';
    if(state.polarReaction==='no')return 'No quería otra montaña rusa hace un rato, pero ya no queda mucho mejor por aquí — pueden intentarlo si cambió de idea.';
  }
  if(a.id==='raptour'&&state.polarReaction==='no')return 'Como no quiere otra montaña rusa por ahora, vamos a algo más tranquilo y con dinosaurios.';
  if(status==='later')return `Ya pasó un rato desde que la fila estaba muy larga — vale la pena volver a intentarlo. ${a.why}`;
  return a.why;
}
/* Razones cortas (máx. 2) que explican por qué se sugiere esto ahora mismo,
   sin convertir la tarjeta en un párrafo largo ni mostrar puntajes (item
   11). El orden de los "if" es la prioridad editorial: lo más específico al
   contexto actual va primero, así slice(0,2) muestra lo más relevante. */
function reasonsFor(a){
  let r=[],status=getStatus(a.id);
  if(status==='repeat')r.push('❤️ La quería repetir.');
  if(status==='later'&&!isOnCooldown(a.id))r.push('🕐 La fila larga anterior ya puede revisarse.');
  if(a.tier<=1&&status==='pending')r.push('🔥 Sigue siendo un imperdible pendiente.');
  if(sameZoneBonus(a))r.push('📍 Ya estás en esta zona.');
  else if(proximityBonus(a))r.push('📍 Está cerca de lo que acabamos de hacer.');
  if(DINO_IDS.includes(a.id)&&DINO_IDS.some(id=>id!==a.id&&BY_ID[id].zone===a.zone&&['pending','later'].includes(getStatus(id))))r.push('🦖 Hay otra actividad de dinosaurios aquí mismo.');
  if(timeOfDayBonus(a))r.push('☀️ Buen momento para las atracciones de agua.');
  if(childBonus(a)&&status==='pending')r.push('⭐ Tiene alta probabilidad de gustarle.');
  if(restBonus(a))r.push('😌 Buena opción para descansar.');
  return r.slice(0,2);
}
function tipFor(a){
  if(a.id==='polar')return '💡 Si le encanta, ir inmediatamente a Roar-O-Saurus.';
  if(a.id==='roar'&&state.polarReaction==='ok')return '💡 Es normal parar aquí si después no quiere más coasters por un rato.';
  if(a.id==='antiquecars'||a.id==='farmtractors')return '💡 Si le encanta, puede repetirla — toca ❤️ QUIERE REPETIR.';
  if(a.id==='drgeyser'||a.id==='splashbattle')return '👕 Confirmen que traen muda de ropa antes de empezar.';
  if(a.id==='moolagoon')return '💡 Puede llevarse bastante tiempo — bien como cierre, no como prioridad.';
  if(a.id==='huffpuff')return '💡 Ideal cuando estén cansados de caminar.';
  return null;
}
/* prioLabel(a): recibe un candidato (id + tier + deferred/skipCooldown
   opcionales, como los que produce candidateList()). El estado "repeat" se
   revisa primero porque manda sobre el tier numérico. */
function prioLabel(a){
  if(getStatus(a.id)==='repeat')return {t:'🔁 REPETIR (favorita)',c:'priorepeat'};
  if(a.deferred)return {t:'🕐 EN ESPERA (fila larga)',c:'priomed'};
  if(a.skipCooldown)return {t:'⏭️ SALTADA HACE POCO',c:'priomed'};
  let tier=a.tier;
  if(tier===0)return {t:'MUY ALTA',c:'priohigh'};
  if(tier===1)return {t:'ALTA',c:'priohigh'};
  if(tier===1.5)return {t:'ALTA (buen momento)',c:'priohigh'};
  if(tier===2.4)return {t:'OPCIONAL PARA DESPUÉS',c:'priomed'};
  if(tier===2||tier===2.6)return {t:'MEDIA',c:'priomed'};
  if(tier===2.8)return {t:'OPCIONAL',c:'priolow'};
  return {t:'BAJA',c:'priolow'};
}

/* ---------- Acciones ----------
   tick() avanza el contador que usa el cooldown de "fila muy larga".
   currentZone solo se actualiza con hecho/repetir: son las dos acciones que
   significan "de verdad estuvimos ahí". Saltar o marcar fila larga no mueve
   la zona porque no llegamos a montarnos. */
function tick(){state.recommendationCount=(state.recommendationCount||0)+1}
function actDone(id){
  tick();
  state.currentZone=BY_ID[id].zone;
  state.lastCompletedId=id;
  if(state.deferred)delete state.deferred[id];
  if(state.skipped)delete state.skipped[id];
  setStatus(id,'done');
}
function actSkip(id){
  tick();
  if(!state.skipped)state.skipped={};
  state.skipped[id]={atCount:state.recommendationCount};
  setStatus(id,'skipped');
}
function actRepeat(id){
  tick();
  state.currentZone=BY_ID[id].zone;
  state.lastCompletedId=id;
  if(state.deferred)delete state.deferred[id];
  if(state.skipped)delete state.skipped[id];
  setStatus(id,'repeat');
}
function actLong(id){
  tick();
  if(!state.deferred)state.deferred={};
  state.deferred[id]={atCount:state.recommendationCount,zone:BY_ID[id].zone};
  if(state.skipped)delete state.skipped[id];
  setStatus(id,'later');
}
function recheckLine(id){
  if(state.deferred)delete state.deferred[id];
  setStatus(id,'pending');
}
function setPolarReaction(v){state.polarReaction=v;save();renderAll()}
function toggleCalm(){state.calmMode=!state.calmMode;save();renderAll()}
function resetDay(){
  if(confirm('¿Borrar todo el progreso del día en Story Land? Esta acción no se puede deshacer.')){
    localStorage.removeItem(KEY);
    state=loadState();
    renderAll();
  }
}

/* ---------- Tabs ---------- */
function setTab(t){
  state.tab=t;save();
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('on'));
  document.getElementById('tab-'+t).classList.add('on');
  ['ahora','checklist','favoritas','tips'].forEach(n=>document.getElementById('nav'+n[0].toUpperCase()+n.slice(1)).classList.toggle('on',n===t));
  document.getElementById('fabNext').classList.toggle('show',t!=='ahora');
  window.scrollTo(0,0);
}
function goAhora(){setTab('ahora')}

/* ---------- Render: Ahora ---------- */
function renderAhora(){
  let el=document.getElementById('tab-ahora');
  let html='';

  // pregunta de reacción a Polar Coaster
  if(getStatus('polar')==='done'&&state.polarReaction===null){
    html+=`<div class="reactcard"><div style="font-size:2rem">🎢</div><h2>¿Cómo le fue en Polar Coaster?</h2><p>Esto nos ayuda a decidir el siguiente paso.</p><div class="reactopts">
    <button onclick="setPolarReaction('love')">😍 Le encantó</button>
    <button onclick="setPolarReaction('ok')">😐 Estuvo bien</button>
    <button onclick="setPolarReaction('no')">😨 No quiere otra montaña rusa</button>
    </div></div>`;
    el.innerHTML=html+calmToggleHtml()+extraSectionsHtml();
    return;
  }

  // banners contextuales
  let mustHandled=MUST.filter(id=>getStatus(id)!=='pending').length;
  let hour=new Date().getHours();
  if(mustHandled>=3&&hour>=11&&hour<15){
    html+=`<div class="banner lunch"><b>🍽️ Buen momento para una pausa</b>Recuerden: almuerzo, baño, agua y protector solar.<ul><li>Después de comer, Loopy Lab es una buena opción tranquila.</li></ul></div>`;
  }
  let waterPending=['drgeyser','splashbattle'].some(id=>{let s=getStatus(id);return s==='pending'||s==='skipped'||s==='later'});
  if(waterBoostActive()&&waterPending){
    html+=`<div class="banner water"><b>💦 Ahora conviene mojarse</b>Es buen momento para las atracciones de agua.<ul><li>👕 ¿Tenemos muda de ropa?</li></ul></div>`;
  }
  if(state.calmMode){
    html+=`<div class="banner calmnotice"><span>😴 Modo tranquilo activado</span><button onclick="toggleCalm()" style="background:#5b3ea8;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:900">🔥 Volver al plan</button></div>`;
  }

  let rec=getRecommendation();
  // Aviso de "no abandonar la zona": si lo que se sugiere ahora NO es la
  // atracción diferida por fila larga, pero esa atracción sigue en la misma
  // zona en la que estamos, ofrecemos revisarla en vez de recomendarla en
  // bucle automáticamente (item 7 / caso de prueba 3).
  if(state.currentZone&&state.deferred){
    let stuck=Object.keys(state.deferred).map(id=>BY_ID[id]).find(a=>a&&a.zone===state.currentZone&&getStatus(a.id)==='later'&&(!rec||rec.id!==a.id));
    if(stuck){
      html+=`<div class="banner zonehint"><span>🦖 ${stuck.name} sigue pendiente en esta zona. ¿Revisamos la fila antes de movernos?</span><button onclick="recheckLine('${stuck.id}')">🔁 Revisar fila</button></div>`;
    }
  }
  // "Cierre de zona" (item 8): si la recomendación nos manda a otra zona,
  // avisar (sin bloquear) si queda algo importante aquí — imperdible
  // pendiente, favorita del niño, o favorita para repetir. Las "later" ya
  // las cubre el banner de arriba, así que no se duplican aquí.
  let zoneClose=zoneCloseCandidate(rec);
  if(zoneClose){
    html+=`<div class="banner zoneclose"><b>📍 Antes de movernos</b>Todavía queda <b>${zoneClose.name}</b> en esta zona (${zoneClose.zone}).</div>`;
  }
  if(!rec){
    html+=`<div class="donebig"><div class="emoji">🎉</div><h2>¡Completaron el plan de Story Land!</h2><p>Ya hicieron todo lo importante. Si quieren, repitan alguna favorita antes de irse.</p></div>`;
  }else{
    let prio=prioLabel(rec);
    let tags=rec.tags.map(t=>`<span class="tag ${t.includes('IMPERDIBLE')||t.includes('INTENSA')?'hot':t.includes('RECOMENDADA')?'star':''}">${t}</span>`).join('');
    let tip=tipFor(rec);
    let reasons=reasonsFor(rec);
    html+=`<div class="nowcard">
      <span class="kicker">⭐ AHORA</span>
      <h2>${rec.name}</h2>
      <div class="zonebadge">${zoneLine(rec)}</div>
      ${mapOrientationHtml(rec)}
      <div class="tagrow">${tags}</div>
      ${reasons.length?`<div class="reasonrow">${reasons.map(r=>`<span class="reasonchip">${r}</span>`).join('')}</div>`:''}
      <div class="whybox"><b>🎯 Por qué ahora:</b> ${whyNow(rec)}</div>
      <div class="factrow">
        <div class="fact">📏 Altura<b>✅ Puede subir</b></div>
        <div class="fact">👨‍👦 Adulto<b>${rec.adult?'Requerido':'No requerido'}</b></div>
        <div class="fact">🔥 Prioridad<b class="${prio.c}">${prio.t}</b></div>
        <div class="fact">📂 Categoría<b>${catLabel(rec.cat)}</b></div>
      </div>
      ${tip?`<div class="tipline">${tip}</div>`:''}
      <div class="actionsgrid">
        <button class="actbtn done" onclick="actDone('${rec.id}')">✅ HECHO</button>
        <button class="actbtn skip" onclick="actSkip('${rec.id}')">⏭️ SALTAR POR AHORA</button>
        <button class="actbtn repeat" onclick="actRepeat('${rec.id}')">❤️ QUIERE REPETIR</button>
        <button class="actbtn long" onclick="actLong('${rec.id}')">👥 FILA MUY LARGA</button>
        <button class="actbtn map" onclick="openParkMap('${rec.id}')">🗺️ VER PARK MAP OFICIAL</button>
      </div>
    </div>`;
    html+=alternativesHtml(rec);
  }

  html+=calmToggleHtml();
  html+=extraSectionsHtml();
  el.innerHTML=html;
}
/* item 8: qué queda "importante" en la zona actual antes de mandarnos a
   otra. No bloquea nada — solo informa; la familia decide si lo ignora. */
function zoneCloseCandidate(rec){
  if(!state.currentZone)return null;
  if(rec&&rec.zone===state.currentZone)return null; // ya nos quedamos en la zona, no hace falta avisar
  return ALL.find(a=>{
    if(a.zone!==state.currentZone)return false;
    let s=getStatus(a.id);
    if(s==='done'||s==='later')return false; // "later" ya lo cubre el banner de fila larga
    if(s==='repeat')return true;
    if(s!=='pending')return false;
    return MUST.includes(a.id)||CHILD_FAVORITE_IDS.includes(a.id);
  })||null;
}
/* item 10: máximo dos alternativas, mismo motor de scoring que la
   recomendación principal, con acciones rápidas para no obligar a buscarlas
   en el checklist. */
function alternativesHtml(rec){
  let alts=getAlternatives(rec);
  if(!alts.length)return '';
  return `<div class="miniSectTitle alts">Si prefieren otra cosa</div><div class="altgrid">${alts.map(alt=>{
    let reasons=reasonsFor(alt);
    return `<div class="altcard">
      <div class="altname">${alt.name}</div>
      <div class="altmeta">${zoneLine(alt)}</div>
      ${reasons.length?`<div class="reasonrow">${reasons.map(r=>`<span class="reasonchip">${r}</span>`).join('')}</div>`:''}
      <div class="altbtns">
        <button onclick="actDone('${alt.id}')">✅ Hecho</button>
        <button onclick="actSkip('${alt.id}')">⏭️ Saltar</button>
        <button onclick="openParkMap('${alt.id}')">🗺️ Mapa</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function catLabel(c){return {imperdible:'🔥 Imperdible',agua:'💦 Agua',clasico:'🏰 Clásico',descanso:'😌 Descanso'}[c]||c}
function calmToggleHtml(){
  return `<button class="calmtoggle ${state.calmMode?'active':''}" onclick="toggleCalm()">${state.calmMode?'🔥 Volver al plan normal':'😴 Necesitamos algo tranquilo'}</button>`;
}
function extraSectionsHtml(){
  let html='';
  let repeats=ALL.filter(a=>getStatus(a.id)==='repeat');
  if(repeats.length){
    html+=`<div class="miniSectTitle">❤️ Repetir antes de irnos</div><div class="minilist">${repeats.map(a=>`<div class="miniitem"><span>${a.name}</span><span class="pill">❤️ favorita</span></div>`).join('')}</div>`;
  }
  let recentlySkipped=ALL.filter(a=>getStatus(a.id)==='skipped'&&isOnSkipCooldown(a.id));
  if(recentlySkipped.length){
    html+=`<div class="miniSectTitle">⏭️ Saltadas por ahora</div><div class="minilist">${recentlySkipped.map(a=>`<div class="miniitem"><span>${a.name}<small>La volveremos a sugerir en un rato.</small></span><span class="pill">⏭️</span></div>`).join('')}</div>`;
  }
  let laters=ALL.filter(a=>getStatus(a.id)==='later');
  let roarOpcional=BY_ID.roar&&state.polarReaction==='no'&&getStatus('roar')==='pending';
  if(laters.length||roarOpcional){
    html+=`<div class="miniSectTitle">🕐 Pendientes de volver / opcional</div><div class="minilist">`;
    laters.forEach(a=>html+=`<div class="miniitem"><span>${a.name}<small>Fila muy larga — la volveremos a sugerir más tarde.</small></span><span class="pill">🕐</span></div>`);
    if(roarOpcional)html+=`<div class="miniitem"><span>Roar-O-Saurus<small>Opcional para después — no insistimos por ahora.</small></span><span class="pill">Opcional</span></div>`;
    html+='</div>';
  }
  return html;
}

/* ---------- Render: Checklist ----------
   expandedItems: qué tarjetas del checklist están abiertas mostrando
   detalle. Es solo estado de UI (no se guarda en localStorage) — se
   reinicia si se recarga la página, igual que cualquier acordeón. */
const expandedItems=new Set();
function toggleExpand(id){
  if(expandedItems.has(id))expandedItems.delete(id);else expandedItems.add(id);
  renderChecklist();
}
function cycleStatus(id,val){
  if(getStatus(id)===val){ // tocar de nuevo el mismo botón = volver a pendiente
    if(state.deferred)delete state.deferred[id];
    if(state.skipped)delete state.skipped[id];
    setStatus(id,'pending');
    return;
  }
  if(val==='done')actDone(id);
  else if(val==='later')actLong(id);
  else if(val==='repeat')actRepeat(id);
  else if(val==='skipped')actSkip(id);
}
function renderChecklist(){
  let el=document.getElementById('tab-checklist');
  let html='<div class="miniSectTitle">☑️ Checklist por categoría</div>';
  CATS.forEach(([cat,label])=>{
    let items=ALL.filter(a=>a.cat===cat);
    html+=`<div class="catblock"><h3>${label}</h3>`;
    items.forEach(a=>{
      let s=getStatus(a.id);
      let stLabel={pending:'⬜ Pendiente',done:'✅ Hecho',skipped:'⏭️ Saltado',later:'🕐 Volver después',repeat:'❤️ Repetir'}[s];
      let open=expandedItems.has(a.id);
      // Mismo tipo de detalle que la tarjeta "Ahora" (por qué + prioridad +
      // tip), pero sin los datos que solo tienen sentido para "lo próximo
      // a hacer ahora mismo" (razones de zona/proximidad, botones de acción).
      let prio=prioLabel({id:a.id,tier:baseTier(a.id),deferred:isOnCooldown(a.id),skipCooldown:isOnSkipCooldown(a.id)});
      let tip=tipFor(a);
      html+=`<div class="item">
      <div class="top2" role="button" tabindex="0" aria-expanded="${open}" onclick="toggleExpand('${a.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleExpand('${a.id}')}">
        <h4><span class="expandicon">${open?'▾':'▸'}</span>${a.name}</h4>
        <span class="statusChip st-${s}">${stLabel}</span>
      </div>
      <div class="itemzone"><span>${zoneLine(a)}</span><button class="zonemapbtn" onclick="event.stopPropagation();openParkMap('${a.id}')">🗺️ Ver mapa</button></div>
      <div class="tagrow">${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      ${open?`<div class="expandbox">
        ${mapOrientationHtml(a)}
        <div class="whybox"><b>🎯 Por qué:</b> ${a.why}</div>
        <div class="factrow">
          <div class="fact">👨‍👦 Adulto<b>${a.adult?'Requerido':'No requerido'}</b></div>
          <div class="fact">🔥 Prioridad<b class="${prio.c}">${prio.t}</b></div>
        </div>
        ${tip?`<div class="tipline">${tip}</div>`:''}
      </div>`:''}
      <div class="itembtns">
        <button class="${s==='done'?'active':''}" title="Hecho" onclick="event.stopPropagation();cycleStatus('${a.id}','done')">✅</button>
        <button class="${s==='skipped'?'active':''}" title="Saltar" onclick="event.stopPropagation();cycleStatus('${a.id}','skipped')">⏭️</button>
        <button class="${s==='later'?'active':''}" title="Fila muy larga / volver después" onclick="event.stopPropagation();cycleStatus('${a.id}','later')">🕐</button>
        <button class="${s==='repeat'?'active':''}" title="Quiere repetir" onclick="event.stopPropagation();cycleStatus('${a.id}','repeat')">❤️</button>
      </div></div>`;
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

/* ---------- Render: Favoritas ---------- */
function renderFavoritas(){
  let el=document.getElementById('tab-favoritas');
  let repeats=ALL.filter(a=>getStatus(a.id)==='repeat');
  if(!repeats.length){
    el.innerHTML=`<div class="favempty"><span class="emoji">❤️</span>Aún no han marcado ninguna atracción para repetir.<br>Cuando algo le encante, toca <b>❤️ QUIERE REPETIR</b>.</div>`;
    return;
  }
  el.innerHTML=`<div class="miniSectTitle">❤️ Quiere repetir</div><div class="minilist">${repeats.map(a=>`<div class="miniitem"><span>${a.name}<small>${catLabel(a.cat)}</small></span><button class="zonemapbtn" onclick="openParkMap('${a.id}')">🗺️ Ver mapa</button><span class="pill">❤️</span></div>`).join('')}</div>`;
}

/* ---------- Render: Tips + Mapa ---------- */
function mapBlockHtml(){
  // Zona a mostrar: la última completada; si todavía no hay nada hecho,
  // usamos la zona de la recomendación actual como referencia inicial.
  let rec=getRecommendation();
  let zone=state.currentZone||(rec&&rec.zone)||null;
  let guide='';
  if(zone){
    let pending=ALL.filter(a=>a.zone===zone&&!['done','repeat'].includes(getStatus(a.id)));
    guide=`<div class="zoneguide"><b>${state.currentZone?'Zona actual':'Próxima zona sugerida'}</b>${zone}
      ${pending.length?`<div style="margin-top:6px">Pendientes aquí:</div><ul>${pending.map(a=>`<li>${a.name}${getStatus(a.id)==='later'?' · 🕐 fila larga':''}</li>`).join('')}</ul>`:'<div style="margin-top:6px">No queda nada pendiente en esta zona 🎉</div>'}
    </div>`;
  }else{
    guide=`<div class="zoneguide">Todavía no han completado ninguna atracción — el mapa oficial les ayuda a ubicar la primera zona.</div>`;
  }
  return `<div class="mapblock">
    <div class="miniSectTitle" style="margin-top:0">🗺️ Park Map</div>
    <button class="mapbig" onclick="openParkMap()">🗺️ ABRIR PARK MAP OFICIAL</button>
    <p class="mapnote">El mapa oficial de Story Land nos ayuda a ubicarnos físicamente (zona / número). Nuestra app sigue decidiendo qué conviene hacer ahora.</p>
    ${guide}
  </div>`;
}
function renderTips(){
  let el=document.getElementById('tab-tips');
  const tips=[
    ['👦','Cumple la altura mínima para las atracciones grandes del parque, incluida Roar-O-Saurus.'],
    ['👨‍👦','Algunas atracciones requieren adulto por estar debajo de 48".'],
    ['👕','Guardar una muda para las atracciones de agua.'],
    ['🚂','No usar el tren durante la primera hora salvo necesidad.'],
    ['📸','Cinderella / Castle son buenos para fotos familiares.'],
    ['❤️','Marcar las atracciones que quiera repetir.'],
    ['👥','Si una fila parece demasiado larga, usar "Volver después".'],
  ];
  el.innerHTML=mapBlockHtml()+`<div class="miniSectTitle">ℹ️ Tips rápidos</div><div class="tipsList">${tips.map(t=>`<div class="tipitem"><span class="ic">${t[0]}</span><span>${t[1]}</span></div>`).join('')}</div><button class="resetbtn" onclick="resetDay()">🔄 Resetear día</button>`;
}

/* ---------- Progreso ---------- */
function renderProgress(){
  let doneTotal=ALL.filter(a=>{let s=getStatus(a.id);return s==='done'||s==='repeat'}).length;
  let pct=Math.round(doneTotal/ALL.length*100);
  document.getElementById('progTxt').textContent=`${doneTotal} de ${ALL.length} realizadas · ${pct}%`;
  document.getElementById('progBar').style.width=pct+'%';
  let mustDone=MUST.filter(id=>{let s=getStatus(id);return s==='done'||s==='repeat'}).length;
  let repeatsPending=ALL.filter(a=>getStatus(a.id)==='repeat').length;
  document.getElementById('mustTxt').textContent=`🔥 Imperdibles: ${mustDone}/${MUST.length}`+(repeatsPending?` · ❤️ ${repeatsPending}`:'');
}

/* ---------- Render total ---------- */
function renderAll(){
  renderProgress();
  renderAhora();
  renderChecklist();
  renderFavoritas();
  renderTips();
}

setTab(state.tab||'ahora');
renderAll();
</script>
</body></html>
